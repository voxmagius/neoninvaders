class AudioSystem {
  constructor() {
    this.ctx = null;
    this.soundEnabled = true;
    this.musicEnabled = true;
    this.musicOsc = null;
    this.musicGain = null;
    this.musicInterval = null;
    this.initialized = false;
  }
  init() {
    if (this.initialized) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.initialized = true;
  }
  resume() {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }
  playShoot() {
    if (!this.soundEnabled || !this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(880, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(220, this.ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.1);
  }
  playExplosion() {
    if (!this.soundEnabled || !this.ctx) return;
    const bufferSize = this.ctx.sampleRate * 0.3;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
    const noise = this.ctx.createBufferSource(); noise.buffer = buffer;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
    noise.connect(gain); gain.connect(this.ctx.destination);
    noise.start();
  }
  playHit() {
    if (!this.soundEnabled || !this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(440, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(110, this.ctx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.15);
  }
  startMusic() {
    if (!this.musicEnabled || !this.ctx || this.musicInterval) return;
    const notes = [110, 110, 130.81, 130.81, 146.83, 146.83, 130.81, 110, 98, 98, 87.31, 87.31, 82.41, 82.41, 73.42, 73.42];
    let noteIndex = 0;
    this.musicGain = this.ctx.createGain();
    this.musicGain.gain.value = 0.04;
    this.musicGain.connect(this.ctx.destination);
    const playNote = () => {
      if (!this.musicInterval) return;
      if (this.musicOsc) { try { this.musicOsc.stop(); } catch(e){} }
      this.musicOsc = this.ctx.createOscillator();
      this.musicOsc.type = 'triangle';
      this.musicOsc.frequency.value = notes[noteIndex % notes.length];
      this.musicOsc.connect(this.musicGain);
      this.musicOsc.start();
      noteIndex++;
    };
    playNote();
    this.musicInterval = setInterval(playNote, 280);
  }
  stopMusic() {
    if (this.musicInterval) { clearInterval(this.musicInterval); this.musicInterval = null; }
    if (this.musicOsc) { try { this.musicOsc.stop(); } catch(e){} this.musicOsc = null; }
  }
}

class Particle {
  constructor(x, y, color, speed, life, shape) {
    this.x = x; this.y = y; this.color = color;
    this.vx = (Math.random() - 0.5) * speed;
    this.vy = (Math.random() - 0.5) * speed;
    this.life = life; this.maxLife = life;
    this.size = Math.random() * 3 + 1;
    this.shape = shape || (Math.random() < 0.33 ? 'square' : (Math.random() < 0.5 ? 'diamond' : 'circle'));
    this.rot = Math.random() * Math.PI * 2;
    this.rotSpeed = (Math.random() - 0.5) * 0.3;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.life--; this.size *= 0.96;
    this.rot += this.rotSpeed;
    this.vx *= 0.98; this.vy *= 0.98;
  }
  draw(ctx) {
    const a = Math.max(0, this.life / this.maxLife);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.shadowBlur = 6; ctx.shadowColor = this.color;
    ctx.fillStyle = this.color;
    const s = Math.max(0.3, this.size);
    if (this.shape === 'square') {
      ctx.fillRect(-s/2, -s/2, s, s);
    } else if (this.shape === 'diamond') {
      ctx.beginPath();
      ctx.moveTo(0, -s); ctx.lineTo(s*0.6, 0); ctx.lineTo(0, s); ctx.lineTo(-s*0.6, 0);
      ctx.closePath(); ctx.fill();
    } else if (this.shape === 'line') {
      ctx.fillRect(-s*1.5, -s*0.3, s*3, s*0.6);
    } else {
      ctx.beginPath(); ctx.arc(0, 0, s, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

class Star {
  constructor(w, h) {
    this.x = Math.random() * w; this.y = Math.random() * h;
    this.size = Math.random() * 1.5 + 0.3;
    this.speed = Math.random() * 0.4 + 0.05;
    this.brightness = Math.random();
    this.w = w;
    this.color = Math.random() < 0.8 ? '#fff' : (Math.random() < 0.5 ? '#aaddff' : '#ffccaa');
  }
  update(h) {
    this.y += this.speed;
    if (this.y > h) { this.y = 0; this.x = Math.random() * this.w; }
    this.brightness += (Math.random() - 0.5) * 0.08;
    this.brightness = Math.max(0.15, Math.min(1, this.brightness));
  }
  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = this.brightness * 0.7;
    ctx.fillStyle = this.color;
    ctx.shadowBlur = 3; ctx.shadowColor = this.color;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

class Player {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.width = 40; this.height = 36;
    this.speed = 6;
    this.color = '#00ffff';
    this.cooldown = 0;
    this.lives = 3;
    this.invincible = 0;
    this.tilt = 0;
    this.enginePhase = Math.random() * Math.PI * 2;
  }
  update(input, w) {
    const moving = input.left || input.right;
    if (input.left) { this.x -= this.speed; this.tilt = Math.max(this.tilt - 0.15, -0.18); }
    else if (input.right) { this.x += this.speed; this.tilt = Math.min(this.tilt + 0.15, 0.18); }
    else { this.tilt *= 0.85; }
    this.x = Math.max(this.width/2, Math.min(w - this.width/2, this.x));
    if (this.cooldown > 0) this.cooldown--;
    if (this.invincible > 0) this.invincible--;
    this.enginePhase += 0.4;
  }
  draw(ctx) {
    if (this.invincible > 0 && Math.floor(this.invincible / 4) % 2 === 0) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.tilt);

    // Engine glow (outer)
    const engineScale = 0.7 + 0.3 * Math.sin(this.enginePhase);
    ctx.save();
    ctx.shadowBlur = 25; ctx.shadowColor = '#0088ff';
    ctx.fillStyle = 'rgba(0,136,255,0.3)';
    ctx.beginPath();
    ctx.ellipse(0, 16, 10 * engineScale, 18 * engineScale, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Engine core
    ctx.save();
    ctx.shadowBlur = 12; ctx.shadowColor = '#00ccff';
    ctx.fillStyle = '#00ccff';
    ctx.beginPath();
    ctx.ellipse(0, 14, 4 * engineScale, 10 * engineScale, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Main hull shadow/outline glow
    ctx.save();
    ctx.shadowBlur = 18; ctx.shadowColor = '#00aaff';
    ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 2;
    ctx.fillStyle = '#001133';

    // Fighter shape
    ctx.beginPath();
    // Nose
    ctx.moveTo(0, -18);
    // Right wing tip
    ctx.lineTo(18, 8);
    // Right wing back
    ctx.lineTo(10, 14);
    // Right body
    ctx.lineTo(4, 14);
    // Bottom right
    ctx.lineTo(3, 10);
    // Center bottom
    ctx.lineTo(0, 12);
    // Bottom left
    ctx.lineTo(-3, 10);
    // Left body
    ctx.lineTo(-4, 14);
    // Left wing back
    ctx.lineTo(-10, 14);
    // Left wing tip
    ctx.lineTo(-18, 8);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();

    // Cockpit / Core
    ctx.save();
    ctx.shadowBlur = 10; ctx.shadowColor = '#ffffff';
    ctx.fillStyle = '#e0ffff';
    ctx.beginPath();
    ctx.ellipse(0, -4, 3, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Wing accents
    ctx.save();
    ctx.shadowBlur = 8; ctx.shadowColor = '#00ffff';
    ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, -8); ctx.lineTo(12, 6);
    ctx.moveTo(0, -8); ctx.lineTo(-12, 6);
    ctx.stroke();
    ctx.restore();

    ctx.restore();
  }
}

class Bullet {
  constructor(x, y, isEnemy, type) {
    this.x = x; this.y = y;
    this.speed = isEnemy ? 3 : 9;
    this.isEnemy = isEnemy;
    this.type = type || 0;
    this.active = true;
    if (!isEnemy) {
      this.color = '#39ff14';
      this.coreColor = '#ffffff';
      this.width = 4; this.height = 18;
    } else {
      const enemyColors = ['#ff00aa', '#ffdd00', '#aa44ff'];
      this.color = enemyColors[this.type % 3];
      this.coreColor = '#ffffff';
      this.width = this.type === 1 ? 8 : 4;
      this.height = this.type === 1 ? 10 : 12;
    }
  }
  update(h) {
    this.y += this.isEnemy ? this.speed : -this.speed;
    if (this.y < -20 || this.y > h + 20) this.active = false;
  }
  draw(ctx) {
    ctx.save();
    if (!this.isEnemy) {
      // Player bullet: core + glow + trail
      ctx.shadowBlur = 14; ctx.shadowColor = '#00ffaa';
      // Trail
      const grad = ctx.createLinearGradient(this.x, this.y + 10, this.x, this.y - 10);
      grad.addColorStop(0, 'rgba(57,255,20,0)');
      grad.addColorStop(0.5, 'rgba(0,255,200,0.5)');
      grad.addColorStop(1, '#ffffff');
      ctx.fillStyle = grad;
      ctx.fillRect(this.x - 2, this.y - 12, 4, 22);
      // Core
      ctx.shadowBlur = 8; ctx.shadowColor = '#ffffff';
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(this.x, this.y - 6, 2.5, 0, Math.PI * 2); ctx.fill();
    } else {
      if (this.type === 1) {
        // Energy orb
        ctx.shadowBlur = 16; ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(this.x, this.y, 5, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 6; ctx.shadowColor = '#ffffff';
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2); ctx.fill();
      } else {
        // Bolt
        ctx.shadowBlur = 10; ctx.shadowColor = this.color;
        const grad = ctx.createLinearGradient(this.x, this.y - 8, this.x, this.y + 8);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.3, this.color);
        grad.addColorStop(1, 'rgba(255,0,170,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y - 8);
        ctx.lineTo(this.x + 3, this.y + 2);
        ctx.lineTo(this.x, this.y + 8);
        ctx.lineTo(this.x - 3, this.y + 2);
        ctx.closePath(); ctx.fill();
      }
    }
    ctx.restore();
  }
}

class Enemy {
  constructor(x, y, type) {
    this.x = x; this.y = y;
    this.type = type;
    this.width = 34; this.height = 28;
    this.active = true;
    this.score = (3 - type) * 10 + 10;
    this.shootTimer = Math.random() * 300 + 150;
    this.phase = Math.random() * Math.PI * 2;
    this.floatOffset = Math.random() * Math.PI * 2;
  }
  update(dx, dy) {
    this.x += dx; this.y += dy;
    this.shootTimer--;
    this.phase += 0.08;
  }
  draw(ctx) {
    ctx.save();
    const pulse = 0.85 + 0.15 * Math.sin(this.phase);
    const floatY = Math.sin(this.floatOffset + this.phase * 0.5) * 2;
    ctx.translate(this.x, this.y + floatY);

    if (this.type === 0) {
      // BASIC ALIEN - biomechanical insectoid
      ctx.save();
      ctx.shadowBlur = 14; ctx.shadowColor = '#ff00ff';
      ctx.strokeStyle = '#ff00ff'; ctx.lineWidth = 1.5;
      ctx.fillStyle = '#1a001a';

      // Body
      ctx.beginPath();
      ctx.moveTo(0, -14);
      ctx.lineTo(8, -4);
      ctx.lineTo(10, 6);
      ctx.lineTo(6, 14);
      ctx.lineTo(-6, 14);
      ctx.lineTo(-10, 6);
      ctx.lineTo(-8, -4);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      // Side limbs
      ctx.beginPath();
      ctx.moveTo(8, -2); ctx.lineTo(16, -8); ctx.lineTo(14, 2);
      ctx.moveTo(-8, -2); ctx.lineTo(-16, -8); ctx.lineTo(-14, 2);
      ctx.moveTo(9, 4); ctx.lineTo(17, 8); ctx.lineTo(12, 12);
      ctx.moveTo(-9, 4); ctx.lineTo(-17, 8); ctx.lineTo(-12, 12);
      ctx.strokeStyle = '#cc00cc'; ctx.lineWidth = 1.2;
      ctx.stroke();

      // Core
      ctx.restore();
      ctx.save();
      ctx.shadowBlur = 10 * pulse; ctx.shadowColor = '#ffff00';
      ctx.fillStyle = '#ffff00';
      ctx.beginPath(); ctx.arc(0, 0, 4 * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(0, 0, 2 * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

    } else if (this.type === 1) {
      // FAST ALIEN - sharp predator
      ctx.save();
      ctx.shadowBlur = 14; ctx.shadowColor = '#ff44aa';
      ctx.strokeStyle = '#ff44aa'; ctx.lineWidth = 1.5;
      ctx.fillStyle = '#1a0010';

      // Sharp body pointing down
      ctx.beginPath();
      ctx.moveTo(0, -12);
      ctx.lineTo(7, -2);
      ctx.lineTo(5, 8);
      ctx.lineTo(0, 18);
      ctx.lineTo(-5, 8);
      ctx.lineTo(-7, -2);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      // Side fins
      ctx.beginPath();
      ctx.moveTo(5, 0); ctx.lineTo(14, -6); ctx.lineTo(10, 6);
      ctx.moveTo(-5, 0); ctx.lineTo(-14, -6); ctx.lineTo(-10, 6);
      ctx.strokeStyle = '#ff88cc'; ctx.lineWidth = 1;
      ctx.stroke();

      // Energy trail effect
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = 0.4 * pulse;
      ctx.fillStyle = '#ff44aa';
      ctx.beginPath();
      ctx.moveTo(0, 10);
      ctx.lineTo(3, 22); ctx.lineTo(0, 26); ctx.lineTo(-3, 22);
      ctx.closePath(); ctx.fill();
      ctx.restore();

      // Core
      ctx.save();
      ctx.shadowBlur = 8 * pulse; ctx.shadowColor = '#ff88ff';
      ctx.fillStyle = '#ff88ff';
      ctx.beginPath(); ctx.arc(0, -2, 3.5 * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(0, -2, 1.5 * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

    } else {
      // HEAVY ALIEN - massive armored
      ctx.save();
      ctx.shadowBlur = 16; ctx.shadowColor = '#ff6600';
      ctx.strokeStyle = '#ff6600'; ctx.lineWidth = 1.5;
      ctx.fillStyle = '#1a0a00';

      // Wide body
      ctx.beginPath();
      ctx.moveTo(0, -12);
      ctx.lineTo(14, -6);
      ctx.lineTo(16, 4);
      ctx.lineTo(10, 14);
      ctx.lineTo(-10, 14);
      ctx.lineTo(-16, 4);
      ctx.lineTo(-14, -6);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      // Armor plates
      ctx.beginPath();
      ctx.moveTo(0, -12); ctx.lineTo(0, 14);
      ctx.moveTo(-8, -4); ctx.lineTo(-8, 10);
      ctx.moveTo(8, -4); ctx.lineTo(8, 10);
      ctx.strokeStyle = '#ffaa33'; ctx.lineWidth = 1;
      ctx.stroke();

      // Side pods
      ctx.fillStyle = '#2a1000';
      ctx.beginPath(); ctx.arc(-12, 2, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(12, 2, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

      // Core
      ctx.restore();
      ctx.save();
      ctx.shadowBlur = 12 * pulse; ctx.shadowColor = '#ffff00';
      ctx.fillStyle = '#ffff00';
      ctx.beginPath(); ctx.arc(0, 0, 5 * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff8800';
      ctx.beginPath(); ctx.arc(0, 0, 3 * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(0, 0, 1.5 * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }
}

class VirtualJoystick {
  constructor() {
    this.active = false;
    this.startX = 0; this.startY = 0;
    this.currentX = 0; this.currentY = 0;
    this.dx = 0;
    this.touchId = null;
  }
  start(id, x, y) {
    this.active = true; this.touchId = id;
    this.startX = x; this.startY = y;
    this.currentX = x; this.currentY = y;
    this.dx = 0;
  }
  move(id, x, y) {
    if (!this.active || this.touchId !== id) return;
    this.currentX = x; this.currentY = y;
    const maxDist = 50;
    const dist = x - this.startX;
    this.dx = Math.max(-1, Math.min(1, dist / maxDist));
  }
  end(id) {
    if (this.touchId !== id) return;
    this.active = false; this.dx = 0; this.touchId = null;
  }
  draw(ctx) {
    if (!this.active) return;
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 2;
    ctx.shadowBlur = 10; ctx.shadowColor = '#00ffff';
    ctx.beginPath(); ctx.arc(this.startX, this.startY, 50, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(0,255,255,0.15)';
    ctx.beginPath(); ctx.arc(this.startX, this.startY, 50, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#00ffff';
    ctx.shadowBlur = 8; ctx.shadowColor = '#00ffff';
    ctx.beginPath(); ctx.arc(this.currentX, this.currentY, 16, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

class ShootButton {
  constructor() {
    this.pressed = false;
    this.x = 0; this.y = 0;
    this.touchId = null;
  }
  setPos(x, y) { this.x = x; this.y = y; }
  start(id, x, y) {
    const dx = x - this.x, dy = y - this.y;
    if (Math.sqrt(dx*dx + dy*dy) < 60) {
      this.pressed = true; this.touchId = id;
      return true;
    }
    return false;
  }
  end(id) {
    if (this.touchId !== id) return;
    this.pressed = false; this.touchId = null;
  }
  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = 0.25;
    ctx.strokeStyle = '#39ff14'; ctx.lineWidth = 2;
    ctx.shadowBlur = 12; ctx.shadowColor = '#39ff14';
    ctx.beginPath(); ctx.arc(this.x, this.y, 48, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = this.pressed ? 'rgba(57,255,20,0.35)' : 'rgba(57,255,20,0.08)';
    ctx.beginPath(); ctx.arc(this.x, this.y, 48, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#39ff14';
    ctx.font = 'bold 13px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowBlur = 8; ctx.shadowColor = '#39ff14';
    ctx.fillText('FIRE', this.x, this.y);
    ctx.restore();
  }
}

class Game {
  constructor() {
    this.canvas = document.getElementById('gameCanvas');
    if (!this.canvas) { document.body.innerHTML = '<div style="color:#f00;padding:20px;">Canvas not found</div>'; return; }
    this.ctx = this.canvas.getContext('2d');
    if (!this.ctx) { document.body.innerHTML = '<div style="color:#f00;padding:20px;">2D context not available</div>'; return; }

    this.audio = new AudioSystem();
    this.joystick = new VirtualJoystick();
    this.shootBtn = new ShootButton();

    this.state = 'MENU';
    this.lang = Storage.get('neon_lang', 'en');
    this.soundOn = Storage.get('neon_sound', 'true') !== 'false';
    this.musicOn = Storage.get('neon_music', 'true') !== 'false';
    this.autoFireOn = Storage.get('neon_autofire', 'false') === 'true';
    this.audio.soundEnabled = this.soundOn;
    this.audio.musicEnabled = this.musicOn;

    this.score = 0;
    this.highScore = Storage.getInt('neon_high', 0);
    this.level = 1;

    this.player = null;
    this.bullets = [];
    this.enemyBullets = [];
    this.enemies = [];
    this.particles = [];
    this.stars = [];
    for (let i = 0; i < 120; i++) this.stars.push(new Star(this.canvas.width, this.canvas.height));

    this.resize();
    window.addEventListener('resize', () => this.resize());

    this.enemyDir = 1;
    this.enemySpeed = 0.5;
    this.enemyDrop = 25;

    this.menuSelection = 0;
    this.settingsSelection = 0;
    this.pauseSelection = 0;

    this.input = { left: false, right: false, shoot: false };

    this.shake = 0;
    this.time = 0;

    this.setupInput();
    this.lastTime = 0;
    this.loop = this.loop.bind(this);
    requestAnimationFrame(this.loop);
  }

  resize() {
    const w = window.innerWidth || document.documentElement.clientWidth || 320;
    const h = window.innerHeight || document.documentElement.clientHeight || 480;
    this.canvas.width = w;
    this.canvas.height = h;
    this.shootBtn.setPos(w - 80, h - 100);
    for (let s of this.stars) s.w = w;
  }

  t(key) {
    return i18n[this.lang][key] || key;
  }

  startGame() {
    this.audio.init();
    this.audio.resume();
    this.player = new Player(this.canvas.width / 2, this.canvas.height - 90);
    this.bullets = [];
    this.enemyBullets = [];
    this.enemies = [];
    this.particles = [];
    this.score = 0;
    this.level = 1;
    this.spawnEnemies();
    this.state = 'PLAYING';
    this.audio.startMusic();
  }

  spawnEnemies() {
    const rows = Math.min(3 + Math.floor(this.level / 2), 6);
    const cols = Math.min(5 + Math.floor(this.level / 2), 10);
    const spacing = 48;
    const startX = this.canvas.width / 2 - (cols * spacing) / 2 + spacing / 2;
    const startY = 70;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        this.enemies.push(new Enemy(startX + c * spacing, startY + r * 36, r % 3));
      }
    }
    this.enemySpeed = 0.4 + this.level * 0.12;
  }

  setupInput() {
    window.addEventListener('keydown', e => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.input.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') this.input.right = true;
      if (e.code === 'Space' || e.code === 'Enter') {
        this.input.shoot = true;
        if (this.state === 'MENU') this.handleMenuSelect();
        else if (this.state === 'PAUSED') this.handlePauseSelect();
        else if (this.state === 'GAMEOVER') this.startGame();
        else if (this.state === 'SETTINGS' || this.state === 'SETTINGS_PAUSE') this.handleSettingsSelect();
      }
      if (e.code === 'Escape' || e.code === 'KeyP') {
        if (this.state === 'PLAYING') { this.state = 'PAUSED'; this.audio.stopMusic(); }
        else if (this.state === 'PAUSED') { this.state = 'PLAYING'; this.audio.startMusic(); }
        else if (this.state === 'SETTINGS') this.state = 'MENU';
        else if (this.state === 'SETTINGS_PAUSE') this.state = 'PAUSED';
      }
      if (e.code === 'ArrowUp' || e.code === 'KeyW') this.navigateUp();
      if (e.code === 'ArrowDown' || e.code === 'KeyS') this.navigateDown();
    });

    window.addEventListener('keyup', e => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.input.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') this.input.right = false;
      if (e.code === 'Space' || e.code === 'Enter') this.input.shoot = false;
    });

    this.canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      for (let t of e.changedTouches) {
        const x = t.clientX, y = t.clientY, id = t.identifier;
        if (this.state === 'PLAYING') {
          if (x > this.canvas.width - 70 && y < 70) {
            this.state = 'PAUSED'; this.audio.stopMusic(); continue;
          }
          const leftZone = x < this.canvas.width * 0.35;
          const rightZone = x > this.canvas.width * 0.65;
          if (leftZone && !this.joystick.active) {
            this.joystick.start(id, x, y);
          } else if (rightZone) {
            if (!this.shootBtn.start(id, x, y)) {
              if (!this.joystick.active) this.joystick.start(id, x, y);
            }
          } else {
            if (!this.joystick.active) this.joystick.start(id, x, y);
          }
        } else {
          this.handleTouchMenu(x, y);
        }
      }
    }, {passive: false});

    this.canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      for (let t of e.changedTouches) {
        this.joystick.move(t.identifier, t.clientX, t.clientY);
      }
    }, {passive: false});

    this.canvas.addEventListener('touchend', e => {
      e.preventDefault();
      for (let t of e.changedTouches) {
        const id = t.identifier;
        this.joystick.end(id);
        this.shootBtn.end(id);
      }
    }, {passive: false});

    this.canvas.addEventListener('touchcancel', e => {
      e.preventDefault();
      for (let t of e.changedTouches) {
        const id = t.identifier;
        this.joystick.end(id);
        this.shootBtn.end(id);
      }
    }, {passive: false});

    this.canvas.addEventListener('mousedown', e => {
      if (this.state === 'PLAYING') {
        if (e.clientX > this.canvas.width - 70 && e.clientY < 70) {
          this.state = 'PAUSED'; this.audio.stopMusic();
        }
      } else {
        this.handleTouchMenu(e.clientX, e.clientY);
      }
    });
  }

  navigateUp() {
    if (this.state === 'MENU') this.menuSelection = Math.max(0, this.menuSelection - 1);
    else if (this.state === 'PAUSED') this.pauseSelection = Math.max(0, this.pauseSelection - 1);
    else if (this.state === 'SETTINGS' || this.state === 'SETTINGS_PAUSE') this.settingsSelection = Math.max(0, this.settingsSelection - 1);
  }

  navigateDown() {
    if (this.state === 'MENU') this.menuSelection = Math.min(1, this.menuSelection + 1);
    else if (this.state === 'PAUSED') this.pauseSelection = Math.min(2, this.pauseSelection + 1);
    else if (this.state === 'SETTINGS' || this.state === 'SETTINGS_PAUSE') this.settingsSelection = Math.min(4, this.settingsSelection + 1);
  }

  handleMenuSelect() {
    if (this.menuSelection === 0) this.startGame();
    else if (this.menuSelection === 1) { this.settingsSelection = 0; this.state = 'SETTINGS'; }
  }

  handlePauseSelect() {
    if (this.pauseSelection === 0) { this.state = 'PLAYING'; this.audio.startMusic(); }
    else if (this.pauseSelection === 1) { this.settingsSelection = 0; this.state = 'SETTINGS_PAUSE'; }
    else if (this.pauseSelection === 2) { this.state = 'MENU'; this.audio.stopMusic(); }
  }

  handleSettingsSelect() {
    if (this.settingsSelection === 0) {
      this.soundOn = !this.soundOn;
      this.audio.soundEnabled = this.soundOn;
      Storage.set('neon_sound', this.soundOn);
    } else if (this.settingsSelection === 1) {
      this.musicOn = !this.musicOn;
      this.audio.musicEnabled = this.musicOn;
      Storage.set('neon_music', this.musicOn);
      if (this.musicOn && this.state !== 'MENU' && this.state !== 'SETTINGS') this.audio.startMusic();
      else this.audio.stopMusic();
    } else if (this.settingsSelection === 2) {
      this.autoFireOn = !this.autoFireOn;
      Storage.set('neon_autofire', this.autoFireOn);
    } else if (this.settingsSelection === 3) {
      const langs = ['en', 'de', 'ru'];
      const idx = langs.indexOf(this.lang);
      this.lang = langs[(idx + 1) % langs.length];
      Storage.set('neon_lang', this.lang);
    } else if (this.settingsSelection === 4) {
      if (this.state === 'SETTINGS') this.state = 'MENU';
      else if (this.state === 'SETTINGS_PAUSE') this.state = 'PAUSED';
    }
  }

  handleTouchMenu(x, y) {
    const cx = this.canvas.width / 2;
    const cy = this.canvas.height / 2;

    if (this.state === 'MENU') {
      if (y > cy - 45 && y < cy + 5) { this.startGame(); }
      else if (y > cy + 25 && y < cy + 75) { this.settingsSelection = 0; this.state = 'SETTINGS'; }
    } else if (this.state === 'PAUSED') {
      const items = [this.t('resume'), this.t('settings'), this.t('restart')];
      const startY = cy - 20;
      for (let i = 0; i < items.length; i++) {
        if (y > startY + i * 70 - 25 && y < startY + i * 70 + 25) {
          this.pauseSelection = i; this.handlePauseSelect();
        }
      }
    } else if (this.state === 'SETTINGS' || this.state === 'SETTINGS_PAUSE') {
      const items = [this.t('sound'), this.t('music'), this.t('autoFire'), this.t('language'), this.t('back')];
      const startY = cy - 40;
      for (let i = 0; i < items.length; i++) {
        if (y > startY + i * 60 - 22 && y < startY + i * 60 + 22) {
          this.settingsSelection = i; this.handleSettingsSelect();
        }
      }
    } else if (this.state === 'GAMEOVER') {
      if (y > cy + 55 && y < cy + 105) this.startGame();
      else if (y > cy + 125 && y < cy + 175) { this.state = 'MENU'; this.audio.stopMusic(); }
    }
  }

  createExplosion(x, y, color, count) {
    count = count || 15;
    // Flash
    this.particles.push(new Particle(x, y, '#ffffff', 0, 8, 'circle'));
    // Colored particles
    for (let i = 0; i < count; i++) {
      const shapes = ['circle', 'diamond', 'square', 'line'];
      const shape = shapes[Math.floor(Math.random() * shapes.length)];
      const speed = 3 + Math.random() * 5;
      const life = 20 + Math.random() * 25;
      this.particles.push(new Particle(x, y, color, speed, life, shape));
    }
    // Secondary color particles
    for (let i = 0; i < Math.floor(count / 2); i++) {
      const secondColor = color === '#00ffff' ? '#0088ff' : (color === '#ff00ff' ? '#ff44aa' : '#ffaa00');
      this.particles.push(new Particle(x, y, secondColor, 2 + Math.random() * 3, 15 + Math.random() * 15, 'diamond'));
    }
  }

  addShake(amount) {
    this.shake = Math.max(this.shake, amount);
  }

  update() {
    this.time++;
    if (this.shake > 0) this.shake *= 0.85;
    if (this.shake < 0.5) this.shake = 0;

    for (let s of this.stars) s.update(this.canvas.height);

    if (this.state === 'PLAYING') {
      const moveLeft = this.input.left || (this.joystick.active && this.joystick.dx < -0.2);
      const moveRight = this.input.right || (this.joystick.active && this.joystick.dx > 0.2);
      const shoot = this.input.shoot || this.shootBtn.pressed || this.autoFireOn;

      this.player.update({left: moveLeft, right: moveRight}, this.canvas.width);

      if (shoot && this.player.cooldown <= 0) {
        this.bullets.push(new Bullet(this.player.x, this.player.y - 20, false));
        this.player.cooldown = 12;
        this.audio.playShoot();
      }

      for (let b of this.bullets) b.update(this.canvas.height);
      for (let b of this.enemyBullets) b.update(this.canvas.height);
      this.bullets = this.bullets.filter(b => b.active);
      this.enemyBullets = this.enemyBullets.filter(b => b.active);

      let edge = false;
      for (let e of this.enemies) {
        e.update(this.enemyDir * this.enemySpeed, 0);
        if (e.x < 25 || e.x > this.canvas.width - 25) edge = true;
        if (e.shootTimer <= 0 && Math.random() < 0.008 * this.level) {
          this.enemyBullets.push(new Bullet(e.x, e.y + 15, true, e.type));
          e.shootTimer = Math.random() * 250 + 150;
        }
      }

      if (edge) {
        this.enemyDir *= -1;
        for (let e of this.enemies) e.y += this.enemyDrop;
      }

      for (let b of this.bullets) {
        for (let e of this.enemies) {
          if (!e.active || !b.active) continue;
          if (Math.abs(b.x - e.x) < e.width/2 + b.width/2 + 2 && Math.abs(b.y - e.y) < e.height/2 + b.height/2 + 2) {
            b.active = false; e.active = false;
            this.score += e.score;
            this.createExplosion(e.x, e.y, e.type === 0 ? '#ff00ff' : (e.type === 1 ? '#ff44aa' : '#ff8800'), 18);
            this.addShake(e.type === 2 ? 4 : 2);
            this.audio.playExplosion();
          }
        }
      }

      if (this.player.invincible <= 0) {
        for (let b of this.enemyBullets) {
          if (!b.active) continue;
          if (Math.abs(b.x - this.player.x) < this.player.width/2 + b.width/2 + 2 &&
              Math.abs(b.y - this.player.y) < this.player.height/2 + b.height/2 + 2) {
            b.active = false;
            this.player.lives--;
            this.player.invincible = 90;
            this.createExplosion(this.player.x, this.player.y, '#00ffff', 25);
            this.addShake(5);
            this.audio.playHit();
            if (this.player.lives <= 0) {
              this.state = 'GAMEOVER';
              if (this.score > this.highScore) {
                this.highScore = this.score;
                Storage.set('neon_high', this.highScore);
              }
              this.audio.stopMusic();
            }
          }
        }
      }

      for (let e of this.enemies) {
        if (e.y > this.canvas.height - 60) {
          this.state = 'GAMEOVER';
          if (this.score > this.highScore) {
            this.highScore = this.score;
            Storage.set('neon_high', this.highScore);
          }
          this.audio.stopMusic();
        }
      }

      this.enemies = this.enemies.filter(e => e.active);

      if (this.enemies.length === 0) {
        this.level++;
        this.spawnEnemies();
        this.player.invincible = 60;
      }

      for (let p of this.particles) p.update();
      this.particles = this.particles.filter(p => p.life > 0);
    }
  }

  drawButton(ctx, x, y, w, h, text, selected) {
    ctx.save();
    ctx.strokeStyle = selected ? '#00ffff' : '#334';
    ctx.lineWidth = selected ? 2.5 : 1.5;
    ctx.shadowBlur = selected ? 18 : 0;
    ctx.shadowColor = '#00aaff';
    ctx.strokeRect(x - w/2, y - h/2, w, h);
    ctx.fillStyle = selected ? 'rgba(0,170,255,0.12)' : 'rgba(0,0,0,0.3)';
    ctx.fillRect(x - w/2, y - h/2, w, h);
    ctx.fillStyle = selected ? '#00ffff' : '#668';
    ctx.font = 'bold ' + (selected ? 22 : 20) + 'px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowBlur = selected ? 12 : 0;
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  draw() {
    const ctx = this.ctx;
    const W = this.canvas.width, H = this.canvas.height;

    // Background - deep space navy
    ctx.fillStyle = '#060614';
    ctx.fillRect(0, 0, W, H);

    // Subtle vignette
    const vig = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.9);
    vig.addColorStop(0, 'rgba(10,10,30,0)');
    vig.addColorStop(1, 'rgba(0,0,10,0.6)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    // Stars
    for (let s of this.stars) s.draw(ctx);

    // Apply screen shake
    ctx.save();
    if (this.shake > 0) {
      const sx = (Math.random() - 0.5) * this.shake * 2;
      const sy = (Math.random() - 0.5) * this.shake * 2;
      ctx.translate(sx, sy);
    }

    if (this.state === 'PLAYING' || this.state === 'PAUSED') {
      this.player.draw(ctx);
      for (let b of this.bullets) b.draw(ctx);
      for (let b of this.enemyBullets) b.draw(ctx);
      for (let e of this.enemies) e.draw(ctx);
      for (let p of this.particles) p.draw(ctx);
    }
    ctx.restore();

    // HUD (drawn without shake)
    if (this.state === 'PLAYING' || this.state === 'PAUSED') {
      this.drawHUD(ctx);
      this.joystick.draw(ctx);
      if (!this.autoFireOn) this.shootBtn.draw(ctx);
    }

    if (this.state === 'MENU') this.drawMenu(ctx);
    else if (this.state === 'SETTINGS' || this.state === 'SETTINGS_PAUSE') this.drawSettings(ctx);
    else if (this.state === 'PAUSED') this.drawPause(ctx);
    else if (this.state === 'GAMEOVER') this.drawGameOver(ctx);
  }

  drawHUD(ctx) {
    const W = this.canvas.width;
    ctx.save();

    // Top bar background
    ctx.fillStyle = 'rgba(0,10,20,0.6)';
    ctx.fillRect(0, 0, W, 52);
    ctx.strokeStyle = 'rgba(0,170,255,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, 52); ctx.lineTo(W, 52); ctx.stroke();

    // Score
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#00ffff';
    ctx.shadowBlur = 8; ctx.shadowColor = '#00aaff';
    ctx.fillText(this.t('score').toUpperCase(), 16, 22);
    ctx.font = 'bold 20px monospace';
    ctx.fillStyle = '#ffffff';
    ctx.shadowBlur = 6; ctx.shadowColor = '#ffffff';
    ctx.fillText(this.score, 16, 44);

    // Lives - draw small ship icons
    ctx.font = 'bold 16px monospace';
    ctx.fillStyle = '#00ffff';
    ctx.shadowBlur = 8; ctx.shadowColor = '#00aaff';
    ctx.fillText(this.t('lives').toUpperCase(), 110, 22);
    for (let i = 0; i < this.player.lives; i++) {
      ctx.save();
      ctx.translate(118 + i * 22, 38);
      ctx.scale(0.35, 0.35);
      ctx.fillStyle = '#00ffff';
      ctx.shadowBlur = 6; ctx.shadowColor = '#00ffff';
      ctx.beginPath();
      ctx.moveTo(0, -14); ctx.lineTo(10, 10); ctx.lineTo(0, 6); ctx.lineTo(-10, 10);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    // Level
    ctx.font = 'bold 16px monospace';
    ctx.fillStyle = '#00ffff';
    ctx.shadowBlur = 8; ctx.shadowColor = '#00aaff';
    ctx.fillText(this.t('level').toUpperCase(), 200, 22);
    ctx.font = 'bold 20px monospace';
    ctx.fillStyle = '#ffffff';
    ctx.shadowBlur = 6; ctx.shadowColor = '#ffffff';
    ctx.fillText(this.level, 200, 44);

    // Pause button (top right)
    ctx.textAlign = 'right';
    ctx.font = 'bold 20px monospace';
    ctx.fillStyle = '#ffffff';
    ctx.shadowBlur = 8; ctx.shadowColor = '#ffffff';
    ctx.fillText(String.fromCharCode(0x23F8), W - 20, 34);

    ctx.restore();
  }

  drawMenu(ctx) {
    const cx = this.canvas.width / 2;
    const cy = this.canvas.height / 2;

    ctx.save();
    ctx.font = 'bold 52px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#00ffff';
    ctx.shadowBlur = 30; ctx.shadowColor = '#00aaff';
    ctx.fillText('NEON INVADERS', cx, cy - 140);

    ctx.font = '14px monospace';
    ctx.fillStyle = '#ff00aa';
    ctx.shadowBlur = 12; ctx.shadowColor = '#ff00aa';
    ctx.fillText('< DEFEND THE GALAXY >', cx, cy - 95);
    ctx.restore();

    const items = [this.t('start'), this.t('settings')];
    for (let i = 0; i < items.length; i++) {
      const y = cy - 20 + i * 70;
      this.drawButton(ctx, cx, y, 260, 55, items[i], this.menuSelection === i);
    }

    ctx.save();
    ctx.font = '18px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffdd00';
    ctx.shadowBlur = 10; ctx.shadowColor = '#ffaa00';
    ctx.fillText(this.t('highScore') + ': ' + this.highScore, cx, cy + 140);
    ctx.font = '12px monospace';
    ctx.fillStyle = '#445';
    ctx.shadowBlur = 0;
    ctx.fillText('ARROWS / A-D: Move   SPACE: Shoot   P: Pause', cx, cy + 180);
    ctx.restore();
  }

  drawSettings(ctx) {
    const cx = this.canvas.width / 2;
    const cy = this.canvas.height / 2;

    ctx.save();
    ctx.font = 'bold 38px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#00ffff';
    ctx.shadowBlur = 22; ctx.shadowColor = '#00aaff';
    ctx.fillText(this.t('settings'), cx, cy - 150);
    ctx.restore();

    const items = [
      this.t('sound') + ': ' + (this.soundOn ? 'ON' : 'OFF'),
      this.t('music') + ': ' + (this.musicOn ? 'ON' : 'OFF'),
      this.t('autoFire') + ': ' + (this.autoFireOn ? 'ON' : 'OFF'),
      this.t('language') + ': ' + this.lang.toUpperCase(),
      this.t('back')
    ];

    for (let i = 0; i < items.length; i++) {
      const y = cy - 50 + i * 60;
      this.drawButton(ctx, cx, y, 320, 50, items[i], this.settingsSelection === i);
    }
  }

  drawPause(ctx) {
    const cx = this.canvas.width / 2;
    const cy = this.canvas.height / 2;

    ctx.fillStyle = 'rgba(2,2,12,0.75)';
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

    ctx.save();
    ctx.font = 'bold 46px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff00aa';
    ctx.shadowBlur = 25; ctx.shadowColor = '#ff00aa';
    ctx.fillText(this.t('pause'), cx, cy - 110);
    ctx.restore();

    const items = [this.t('resume'), this.t('settings'), this.t('restart')];
    for (let i = 0; i < items.length; i++) {
      const y = cy - 20 + i * 70;
      this.drawButton(ctx, cx, y, 280, 55, items[i], this.pauseSelection === i);
    }
  }

  drawGameOver(ctx) {
    const cx = this.canvas.width / 2;
    const cy = this.canvas.height / 2;

    ctx.fillStyle = 'rgba(2,2,12,0.85)';
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

    ctx.save();
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff0055';
    ctx.shadowBlur = 30; ctx.shadowColor = '#ff0055';
    ctx.fillText(this.t('gameOver'), cx, cy - 100);

    ctx.font = '24px monospace';
    ctx.fillStyle = '#ffffff';
    ctx.shadowBlur = 10; ctx.shadowColor = '#ffffff';
    ctx.fillText(this.t('score') + ': ' + this.score, cx, cy - 30);
    ctx.fillText(this.t('highScore') + ': ' + this.highScore, cx, cy + 10);

    if (this.score >= this.highScore && this.score > 0) {
      ctx.fillStyle = '#ffdd00';
      ctx.shadowBlur = 18; ctx.shadowColor = '#ffaa00';
      ctx.font = '18px monospace';
      ctx.fillText('* NEW RECORD! *', cx, cy + 45);
    }
    ctx.restore();

    this.drawButton(ctx, cx, cy + 90, 260, 55, this.t('restart'), true);
    this.drawButton(ctx, cx, cy + 165, 260, 55, this.t('back'), false);
  }

  loop(timestamp) {
    this.lastTime = timestamp;
    this.update();
    this.draw();
    requestAnimationFrame(this.loop);
  }
}

try {
  new Game();
} catch(e) {
  document.body.innerHTML = '<div style="color:#f00;padding:20px;font-family:monospace;">Error: ' + e.message + '<br>' + e.stack + '</div>';
}
</script>
</body>
</html>
